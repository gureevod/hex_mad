# Allure Framework Configuration
# Конфигурация Allure Framework для Hex Automation Framework

# Основные настройки отчета
allure.results.directory=target/allure-results
allure.link.issue.pattern=https://jira.company.com/browse/{}
allure.link.tms.pattern=https://testmanagement.company.com/test/{}

# Настройки категорий ошибок
allure.categories.file=allure-categories.json

# Настройки окружения
allure.environment.file=environment.properties

# Настройки истории выполнения
allure.history.directory=target/allure-history

# Настройки тренда выполнения
allure.trend.directory=target/allure-trend

# Настройки логирования Allure
allure.logging.level=INFO

# Настройки вложений
allure.attachment.max.size=10MB
allure.attachment.screenshot.format=PNG
allure.attachment.video.format=MP4

# Настройки для интеграции с CI/CD
allure.report.title=Hex Automation Framework Test Report
allure.report.name=Test Execution Report
allure.report.description=Automated test execution results for Hex Framework

# Настройки для группировки тестов
allure.epic.label=epic
allure.feature.label=feature
allure.story.label=story
allure.severity.label=severity
allure.owner.label=owner
allure.tag.label=tag

# Настройки для временных меток
allure.timestamp.format=yyyy-MM-dd HH:mm:ss

# Настройки для ретраев
allure.retry.enabled=true
allure.retry.max.count=3

# Настройки для параллельного выполнения
allure.parallel.enabled=true
allure.thread.count=4

# Настройки для очистки старых результатов
allure.cleanup.enabled=true
allure.cleanup.days=30

# Настройки для интеграции с Selenide
allure.selenide.screenshots=true
allure.selenide.page.source=true
allure.selenide.video=false

# Настройки для интеграции с RestAssured
allure.restassured.request.logging=true
allure.restassured.response.logging=true
allure.restassured.request.template=http-request.ftl
allure.restassured.response.template=http-response.ftl

# Настройки безопасности
allure.security.redact.headers=Authorization,Cookie,Set-Cookie,X-Auth-Token,X-API-Key
allure.security.redact.parameters=password,pwd,secret,token,key,auth

# Настройки локализации
allure.locale=ru
allure.date.format=dd.MM.yyyy
allure.time.format=HH:mm:ss

# Настройки для кастомных меток
allure.label.correlationId=Correlation ID
allure.label.testClass=Test Class
allure.label.testMethod=Test Method
allure.label.environment=Environment
allure.label.browser=Browser
allure.label.version=Version

# Настройки для экспорта
allure.export.enabled=true
allure.export.format=JSON,XML,CSV
allure.export.directory=target/allure-export

# Настройки для уведомлений
allure.notifications.enabled=false
allure.notifications.webhook.url=
allure.notifications.email.enabled=false

# Настройки производительности
allure.performance.monitoring=true
allure.performance.threshold.warning=5000
allure.performance.threshold.critical=10000

# Настройки для дебага
allure.debug.enabled=false
allure.debug.level=INFO
allure.debug.output=target/allure-debug.log