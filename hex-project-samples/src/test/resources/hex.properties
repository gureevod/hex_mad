# Hex Framework - Конфигурация проекта по умолчанию
# Этот файл содержит настройки для локальной разработки и тестирования
# Для других окружений используйте hex-${hex.environment}.properties (например, hex-ci.properties)

# ============================================
# ОБЩИЕ НАСТРОЙКИ
# ============================================

# Профиль окружения (local, ci, qa, prod)
hex.environment=local

# Уровень логирования (TRACE, DEBUG, INFO, WARN, ERROR)
hex.logging.level=INFO

# Таймаут по умолчанию (секунды)
hex.timeout.default=20

# Режим отладки
hex.debug.enabled=false

# Настройки повторов
hex.retry.count=3
hex.retry.delay=1000

# Параллельное выполнение
hex.parallel.enabled=true
hex.parallel.threads=4

# ============================================
# UI НАСТРОЙКИ
# ============================================

# Браузер (chrome, firefox, edge, safari)
hex.ui.browser=chrome

# Headless режим
hex.ui.headless=false

# Размеры окна браузера
hex.ui.window.width=1920
hex.ui.window.height=1080

# Базовый URL для UI тестов
hex.ui.base.url=http://uitestingplayground.com

# Таймауты UI (секунды)
hex.ui.timeout=10
hex.ui.page.load.timeout=30
hex.ui.implicit.timeout=5

# Скриншоты
hex.ui.screenshots.enabled=true
hex.ui.screenshots.folder=target/screenshots

# Видеозапись
hex.ui.video.enabled=false
hex.ui.video.folder=target/videos

# Selenium Grid (оставьте пустым для локального запуска)
hex.ui.grid.url=

# Логирование UI
hex.ui.logging.enabled=true
hex.ui.logging.level=INFO

# Дополнительные настройки
hex.ui.highlight.enabled=false
hex.ui.action.delay=0
hex.ui.page.load.strategy=normal

# ============================================
# API НАСТРОЙКИ
# ============================================

# Базовый URL для API тестов
hex.api.base.url=http://localhost:8080

# Таймаут API запросов (секунды)
hex.api.timeout=30

# Настройки повторов для API
hex.api.retry.count=3
hex.api.retry.delay=1000

# Аутентификация (none, basic, bearer, oauth2)
hex.api.auth.type=none
hex.api.auth.username=
hex.api.auth.password=
hex.api.auth.bearer.token=

# Заголовки по умолчанию
hex.api.content.type=application/json
hex.api.accept=application/json

# Логирование API
hex.api.logging.enabled=true

# SSL валидация
hex.api.ssl.validation.enabled=true

# Максимальный размер ответа (байты)
hex.api.response.max.size=10485760