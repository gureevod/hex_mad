# Hex Framework - Конфигурация для CI окружения
# Этот файл содержит настройки для запуска тестов в CI/CD пайплайне
# Активируется через: mvn test -Dhex.environment=ci

# ============================================
# ОБЩИЕ НАСТРОЙКИ
# ============================================

# Уровень логирования для CI (более детальный)
hex.logging.level=DEBUG

# Таймауты увеличены для CI окружения
hex.timeout.default=60

# Режим отладки отключен в CI
hex.debug.enabled=false

# Настройки повторов (больше попыток в CI)
hex.retry.count=5
hex.retry.delay=2000

# Параллельное выполнение (больше потоков в CI)
hex.parallel.enabled=true
hex.parallel.threads=8

# ============================================
# UI НАСТРОЙКИ ДЛЯ CI
# ============================================

# Браузер для CI (можно переопределить через -Dhex.ui.browser=firefox)
hex.ui.browser=chrome

# Headless режим обязателен в CI
hex.ui.headless=true

# Размеры окна браузера
hex.ui.window.width=1920
hex.ui.window.height=1080

# Базовый URL для UI тестов в CI
hex.ui.base.url=http://test-app:3000

# Таймауты UI увеличены для CI
hex.ui.timeout=15
hex.ui.page.load.timeout=60
hex.ui.implicit.timeout=10

# Скриншоты обязательны в CI
hex.ui.screenshots.enabled=true
hex.ui.screenshots.folder=target/screenshots

# Видеозапись включена в CI для отладки
hex.ui.video.enabled=true
hex.ui.video.folder=target/videos

# Selenium Grid для CI (если используется)
hex.ui.grid.url=http://selenium-hub:4444/wd/hub

# Логирование UI
hex.ui.logging.enabled=true
hex.ui.logging.level=DEBUG

# Дополнительные настройки
hex.ui.highlight.enabled=false
hex.ui.action.delay=100
hex.ui.page.load.strategy=normal

# ============================================
# API НАСТРОЙКИ ДЛЯ CI
# ============================================

# Базовый URL для API тестов в CI
hex.api.base.url=http://test-api:8080

# Таймаут API запросов увеличен для CI
hex.api.timeout=60

# Настройки повторов для API в CI
hex.api.retry.count=5
hex.api.retry.delay=2000

# Аутентификация (настраивается через переменные окружения)
hex.api.auth.type=bearer
# hex.api.auth.bearer.token будет взят из переменной окружения HEX_API_AUTH_BEARER_TOKEN

# Заголовки по умолчанию
hex.api.content.type=application/json
hex.api.accept=application/json

# Логирование API обязательно в CI
hex.api.logging.enabled=true

# SSL валидация может быть отключена для тестовых окружений
hex.api.ssl.validation.enabled=false

# Максимальный размер ответа
hex.api.response.max.size=10485760