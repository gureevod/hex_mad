# Hex Framework - Библиотечные дефолты для hex-core
# Эти значения имеют самый низкий приоритет и могут быть переопределены
# через hex.properties, hex-${hex.environment}.properties, переменные окружения или системные свойства

# Профиль окружения по умолчанию
hex.environment=local

# Настройки логирования
hex.logging.level=INFO

# Таймауты
hex.timeout.default=30

# Режим отладки
hex.debug.enabled=false

# Настройки повторов
hex.retry.count=3
hex.retry.delay=1000

# Параллельное выполнение
hex.parallel.enabled=true
hex.parallel.threads=4