# Hex Framework Configuration - Local Environment
# This file contains default configuration for local development

# Environment Configuration
hex.environment=local

# Logging Configuration
hex.logging.level=DEBUG

# Timeout Configuration (in seconds)
hex.timeout.default=30

# Debug Configuration
hex.debug.enabled=true

# Retry Configuration
hex.retry.count=3
hex.retry.delay=1000

# Parallel Execution Configuration
hex.parallel.enabled=true
hex.parallel.threads=4

# API Configuration Defaults
hex.api.timeout=30
hex.api.retry.count=3
hex.api.base.url=http://localhost:8080

# UI Configuration Defaults
hex.ui.browser=chrome
hex.ui.headless=false
hex.ui.window.width=1920
hex.ui.window.height=1080
hex.ui.timeout=10
hex.ui.base.url=http://localhost:3000