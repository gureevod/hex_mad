# Hex Framework Configuration - CI Environment
# This file contains configuration overrides for Jenkins/CI environment

# Environment Configuration
hex.environment=ci

# Logging Configuration
hex.logging.level=INFO

# Timeout Configuration (in seconds) - longer timeouts for CI
hex.timeout.default=60

# Debug Configuration - disabled in CI
hex.debug.enabled=false

# Retry Configuration - more retries in CI due to network instability
hex.retry.count=5
hex.retry.delay=2000

# Parallel Execution Configuration - more threads in CI
hex.parallel.enabled=true
hex.parallel.threads=8

# API Configuration for CI
hex.api.timeout=60
hex.api.retry.count=5
hex.api.base.url=${API_BASE_URL}

# UI Configuration for CI - headless mode
hex.ui.browser=chrome
hex.ui.headless=true
hex.ui.window.width=1920
hex.ui.window.height=1080
hex.ui.timeout=30
hex.ui.base.url=${UI_BASE_URL}

# CI-specific settings
hex.ci.build.number=${BUILD_NUMBER}
hex.ci.job.name=${JOB_NAME}
hex.ci.workspace=${WORKSPACE}