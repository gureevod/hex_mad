# Hex Framework - Библиотечные дефолты для hex-core-api
# Эти значения имеют самый низкий приоритет и могут быть переопределены
# через hex.properties, hex-${hex.environment}.properties, переменные окружения или системные свойства

# Базовые настройки API
hex.api.base.url=http://localhost:8080
hex.api.timeout=30

# Настройки повторов для API
hex.api.retry.count=3
hex.api.retry.delay=1000

# Аутентификация
hex.api.auth.type=none
hex.api.auth.username=
hex.api.auth.password=
hex.api.auth.bearer.token=
hex.api.auth.oauth2.token.url=
hex.api.auth.oauth2.client.id=
hex.api.auth.oauth2.client.secret=

# Заголовки по умолчанию
hex.api.content.type=application/json
hex.api.accept=application/json

# Логирование
hex.api.logging.enabled=true

# SSL
hex.api.ssl.validation.enabled=true

# Ограничения
hex.api.response.max.size=10485760